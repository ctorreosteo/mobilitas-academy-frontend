pluginManagement {
  // Android Studio often has no shell PATH (nvm/fnm/Homebrew). Prefer NODE_BINARY or local.properties.
  def nodeExecutable = {
    def n = System.getenv("NODE_BINARY")
    if (n != null && !n.trim().isEmpty()) return n.trim()
    def p = new Properties()
    def f = new File(settingsDir, "local.properties")
    if (f.exists()) {
      f.withInputStream { p.load(it) }
      n = p.getProperty("node.executable")
      if (n != null && !n.trim().isEmpty()) return n.trim()
    }
    return "node"
  }()

  // expo-autolinking-settings and other scripts still exec bare `node`. Prepend node's dir to PATH
  // and set NODE_BINARY env var so Android Studio (no nvm) can apply the plugin and run tasks.
  def nodeFile = new File(nodeExecutable)
  if (nodeFile.isFile()) {
    def nodeHome = nodeFile.parentFile.absolutePath
    def currentPath = System.getenv("PATH") ?: ""
    if (!currentPath.split(File.pathSeparator).contains(nodeHome)) {
      def newPath = nodeHome + File.pathSeparator + currentPath
      try {
        def processEnvironment = Class.forName("java.lang.ProcessEnvironment")
        def variableClass = Class.forName("java.lang.ProcessEnvironment\$Variable")
        def valueClass = Class.forName("java.lang.ProcessEnvironment\$Value")
        def variableOf = variableClass.getDeclaredMethod("valueOf", String.class)
        def valueOf = valueClass.getDeclaredMethod("valueOf", String.class)
        variableOf.setAccessible(true)
        valueOf.setAccessible(true)
        def envField = processEnvironment.getDeclaredField("theEnvironment")
        envField.setAccessible(true)
        def env = envField.get(null)
        env.put(variableOf.invoke(null, "PATH"), valueOf.invoke(null, newPath))
        env.put(variableOf.invoke(null, "NODE_BINARY"), valueOf.invoke(null, nodeExecutable))
      } catch (Throwable ignored) {
      }
    }
  }

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExecutable, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExecutable, "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Mobilitas'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
